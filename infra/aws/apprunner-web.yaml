version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - corepack enable
      - pnpm install --frozen-lockfile
    build:
      - pnpm build
run:
  command: pnpm start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: NEXT_PUBLIC_BACKEND
      value: api
