AWSTemplateFormatVersion: "2010-09-09"
Description: Adjudex production alarms and audit-log storage.

Parameters:
  ApiServiceName:
    Type: String
  WebhookFailureThreshold:
    Type: Number
    Default: 5

Resources:
  ResolutionEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebhookFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Webhook delivery failures exceeded threshold.
      Namespace: Adjudex
      MetricName: WebhookFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref WebhookFailureThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ResolutionFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Market resolution failures detected.
      Namespace: Adjudex
      MetricName: ResolutionFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RpcLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Indexer/RPC lag is above production threshold.
      Namespace: Adjudex
      MetricName: RpcLagBlocks
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching

Outputs:
  EvidenceBucketName:
    Value: !Ref ResolutionEvidenceBucket
