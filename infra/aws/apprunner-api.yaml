version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - corepack enable
      - pnpm install --frozen-lockfile
    build:
      - pnpm --filter @adjudex/api build
run:
  command: pnpm --filter @adjudex/api start
  network:
    port: 8787
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8787"
    - name: RATE_LIMIT_BACKEND
      value: redis
    - name: MARKETS_CACHE_BACKEND
      value: redis
    - name: MARKETS_CACHE_TTL_SECONDS
      value: "15"
