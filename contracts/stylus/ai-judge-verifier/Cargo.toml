[package]
name = "ai-judge-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stylus port of AIJudgeVerifier.sol — ECDSA-signed AI judge verdict verifier for PariAI parimutuel pools."

[dependencies]
stylus-sdk = "0.10.7"
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha3 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
